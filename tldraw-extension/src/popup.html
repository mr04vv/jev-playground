<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>Jev tldraw Note Grouper</title>
    <style>
      body { font: 14px system-ui, sans-serif; width: 320px; padding: 12px; }
      label { display: block; margin: 10px 0 4px; }
      input, textarea { width: 100%; box-sizing: border-box; }
      button { margin-top: 12px; width: 100%; padding: 8px; }
      #status { margin-top: 10px; min-height: 1em; }
    </style>
  </head>
  <body>
    <label for="apiKey">TypeSafe API キー</label>
    <input id="apiKey" type="password" autocomplete="off" />
    <label for="categories">分類（1 行に 1 つ。当てはまらない付箋は「その他」になります）</label>
    <textarea id="categories" rows="6" placeholder="課題&#10;アイデア&#10;質問"></textarea>
    <label><input id="live" type="checkbox" style="width:auto" /> ライブ仕分け（書き終えた付箋を分類の色に塗る）</label>
    <button id="run">付箋をグループ化</button>
    <div id="status"></div>
    <script src="popup.js" type="module"></script>
  </body>
</html>
